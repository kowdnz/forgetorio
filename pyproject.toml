[project]
name = "factorio-modpack-launcher"
version = "0.1.1"
description = "Launcher de modpacks/perfis isolados para Factorio"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.6", "httpx>=0.27", "keyring>=24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.gui-scripts]
factorio-launcher = "factorio_launcher.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
factorio_launcher = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--basetemp=.pytest_run -p no:cacheprovider"
